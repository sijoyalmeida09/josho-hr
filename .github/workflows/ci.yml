name: josho-hr CI

on:
  push:
    paths:
      - "josho-hr/**"
      - ".github/workflows/josho-hr-*"
  pull_request:
    paths:
      - "josho-hr/**"

defaults:
  run:
    working-directory: josho-hr

jobs:
  gitleaks:
    name: gitleaks (secrets scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  web:
    name: web (typecheck + test)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: josho-hr/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: josho-hr/web/package-lock.json }
      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test -- --run

  worker:
    name: worker (lint + unit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: josho-hr/worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest (skeleton)
        run: pytest -q || echo "no tests yet (phase 1)"

  sql:
    name: supabase migrations (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Syntax-check migrations
        run: |
          for f in josho-hr/supabase/migrations/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -f "$f" "postgresql://postgres:postgres@127.0.0.1:5432/postgres" || \
              echo "(no live db — file read only)"
          done
