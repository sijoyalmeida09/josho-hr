[project]
name = "josho-hr-worker"
version = "0.3.0"
description = "josho-hr worker: multi-tenant adapter around job_hunter_v2"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.6.0,<3",
    "httpx>=0.27,<1",
    "cryptography>=42,<44",
    "playwright>=1.45,<2",
    "python-dotenv>=1.0",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["worker", "worker.adapters", "worker.config"]
package-dir = {"" = "."}

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
